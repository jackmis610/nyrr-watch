name: nyrr-watch

# The Cloudflare timer in worker/ starts this every 15 minutes through workflow_dispatch. GitHub skips
# most scheduled runs, so the schedule below is only a backup. Times are UTC and cover about
# 4am-11pm Mountain: hourly by default, every 15 minutes from 10 days before each race.
on:
  schedule:
    - cron: '37 0-5,11-23 30-31 10 *'
    - cron: '37 0-5,11-23 1-11,22-24 11 *'
    - cron: '37 0-5,11-23 12-20,31 12 *'
    - cron: '7,22,37,52 11-23 12-21,25-30 11 *'
    - cron: '7,22,37,52 0-5 13-22,26-30 11 *'
    - cron: '7,22,37,52 11-23 1-11,21-30 12 *'
    - cron: '7,22,37,52 0-5 1-12,22-31 12 *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test alert instead of checking NYRR
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Denver
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I watch.py ${{ inputs.test_alert && '--test' || '' }}
      - name: Show this run's log
        if: always()
        run: tail -n 5 watch.log || true
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || { git commit -m "Update state [skip ci]" && git push; }
