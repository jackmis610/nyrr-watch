name: nyrr-watch

# The Cloudflare worker in worker/ checks NYRR every minute itself. It starts this workflow every
# 15 minutes only when it can't read NYRR from Cloudflare; otherwise this runs by hand.
on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test alert instead of checking NYRR
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Denver
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I watch.py ${{ inputs.test_alert && '--test' || '' }}
      - name: Show this run's log
        if: always()
        run: tail -n 5 watch.log || true
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || { git commit -m "Update state [skip ci]" && git push; }
